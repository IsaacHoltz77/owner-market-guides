/* Layout: navy masthead band with logo + submarket title, tab bar, then a single reading column of report sections; data cards and charts sit on white panels. */
:root{
  --bg:#F4F6F7; --surface:#FFFFFF; --ink:#1F2B34; --muted:#5A6670; --rule:#DCE3E7;
  --navy:#253C4E; --navy-deep:#1B2D3B; --blue:#42A3B3; --blue-ink:#23798A; --gold:#B3936A; --gold-ink:#8A6B44;
  --tint:#E9F3F5; --on-navy:#F9F9F9; --on-navy-muted:#B9C7D1;
  --f-display:"Nevis","Montserrat","Helvetica Neue",Arial,sans-serif;
  --f-body:"Montserrat","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111B23; --surface:#18252F; --ink:#E7ECEF; --muted:#9EABB5; --rule:#2B3B48;
  --navy:#253C4E; --navy-deep:#0D161D; --blue:#4FB3C3; --blue-ink:#74C7D4; --gold:#C9A87E; --gold-ink:#D4B48A;
  --tint:#1C3340; --on-navy:#F9F9F9; --on-navy-muted:#A9BAC6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111B23; --surface:#18252F; --ink:#E7ECEF; --muted:#9EABB5; --rule:#2B3B48;
  --navy:#253C4E; --navy-deep:#0D161D; --blue:#4FB3C3; --blue-ink:#74C7D4; --gold:#C9A87E; --gold-ink:#D4B48A;
  --tint:#1C3340; --on-navy:#F9F9F9; --on-navy-muted:#A9BAC6; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy-deep)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,.disp{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.02em;text-wrap:balance;margin:0}
p{margin:0}
a{color:var(--blue-ink)}
a:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Masthead */
.mast{background:var(--navy);color:var(--on-navy)}
.mast .wrap{padding-block:28px 0}
.mast-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{height:40px;width:auto;display:block}
.edition{font-family:var(--f-display);font-size:12px;letter-spacing:.12em;border:1px solid rgba(249,249,249,.35);padding:6px 12px;border-radius:2px;color:var(--on-navy)}
.mast-title{padding-block:40px 28px;display:grid;gap:14px;max-width:780px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.mast .eyebrow{color:var(--blue)}
.mast h1{font-size:clamp(30px,5.4vw,54px);line-height:1.02;color:var(--on-navy)}
.mast-sub{color:var(--on-navy-muted);font-size:16px;max-width:62ch}
.tabs{display:flex;gap:4px;overflow-x:auto;border-top:1px solid rgba(249,249,249,.14)}
.tab{appearance:none;background:none;border:0;color:var(--on-navy-muted);font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:13px;padding:16px 4px;margin-right:24px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--on-navy);border-bottom-color:var(--blue)}

/* Section rail */
.jump{background:var(--surface);border-bottom:1px solid var(--rule)}
.jump .wrap{display:flex;gap:6px 22px;flex-wrap:wrap;padding-block:12px}
.jump a{font-size:13px;font-weight:600;color:var(--muted);text-decoration:none}
.jump a:hover{color:var(--blue-ink)}

main .wrap{display:grid;gap:56px;padding-block:44px 64px}
section{display:grid;gap:22px;scroll-margin-top:16px}
.sec-head{display:grid;gap:8px;max-width:760px}
.sec-head .eyebrow{color:var(--blue-ink)}
.sec-head h2{font-size:clamp(22px,3vw,30px);line-height:1.1;color:var(--ink)}
.lede{color:var(--muted);font-size:16px;max-width:66ch}
.source{font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:10px}

/* Snapshot tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}
.tile{background:var(--surface);padding:18px 18px 16px;display:grid;gap:4px;align-content:start}
.tile .k{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-family:var(--f-display);font-size:28px;line-height:1.1;color:var(--navy)}
:root[data-theme="dark"] .tile .v{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tile .v{color:var(--ink)}}
.tile .d{font-size:12.5px;color:var(--muted)}
.tile .d b{color:var(--blue-ink);font-weight:600}

.panel{background:var(--surface);border:1px solid var(--rule);padding:20px;display:grid;gap:14px;min-width:0;align-content:start}
.charts2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}
.tier-row{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px}
@media (max-width:900px){.tier-row{grid-template-columns:1fr}}
.panel h3{font-size:14px;letter-spacing:.06em;color:var(--ink)}
.panel .note{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:16px}

/* Tables */
.tbl-wrap{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:2px solid var(--navy);white-space:nowrap}
:root[data-theme="dark"] th{border-bottom-color:var(--blue)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) th{border-bottom-color:var(--blue)}}
td{padding:11px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
td.r,th.r{text-align:right}
tr.hl td{background:var(--tint);font-weight:600}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--tint);color:var(--blue-ink);white-space:nowrap}
.pill.gold{background:transparent;border:1px solid var(--gold);color:var(--gold-ink)}

/* Charts */
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.c-grid{stroke:var(--rule);stroke-width:1}
.c-axis{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.c-lbl{fill:var(--ink);font-family:var(--f-body);font-size:11.5px;font-weight:600}
.c-fc{fill:var(--tint);opacity:.6}
.c-fc-t{fill:var(--muted);font-family:var(--f-body);font-size:10px;letter-spacing:.1em}
.c-l1{fill:none;stroke:var(--navy);stroke-width:2.5}
.c-l2{fill:none;stroke:var(--gold);stroke-width:2.5}
:root[data-theme="dark"] .c-l1{stroke:var(--blue)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .c-l1{stroke:var(--blue)}}
.c-dash{stroke-dasharray:5 4}
.c-dot1{fill:var(--navy)} .c-dot2{fill:var(--gold)}
:root[data-theme="dark"] .c-dot1{fill:var(--blue)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .c-dot1{fill:var(--blue)}}
.c-b1{fill:var(--navy)} .c-b2{fill:var(--blue)}
:root[data-theme="dark"] .c-b1{fill:#5C7F99}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .c-b1{fill:#5C7F99}}
.c-faded{opacity:.42}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px}
.lg-navy{background:var(--navy)} .lg-blue{background:var(--blue)} .lg-gold{background:var(--gold)}
:root[data-theme="dark"] .lg-navy{background:#5C7F99}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lg-navy{background:#5C7F99}}

/* Tier bars */
.tierbars{display:grid;gap:14px}
.tb{display:grid;grid-template-columns:minmax(120px,170px) 1fr;gap:12px;align-items:center}
.tb .name{font-size:13px;font-weight:600}
.tb .bars{display:grid;gap:4px;min-width:0}
.bar{height:14px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);white-space:nowrap}
.bar span{display:block;height:100%;min-width:2px}
.bar .n{background:var(--blue)} .bar .m{background:var(--rule)}
.bar.nl{color:var(--ink);font-weight:600}

/* Lists */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--rule);padding:18px;display:grid;gap:8px;align-content:start}
.card .tag{justify-self:start}
.card h3{font-size:15px;letter-spacing:.04em;line-height:1.25}
.card p{font-size:14px;color:var(--muted)}
.card .fig{font-family:var(--f-display);font-size:20px;color:var(--blue-ink);letter-spacing:.02em}
.callout{background:var(--navy);color:var(--on-navy);padding:22px;display:grid;gap:6px}
.callout .eyebrow{color:var(--blue)}
.callout p{color:var(--on-navy-muted);font-size:14px}
.callout .big{font-family:var(--f-display);font-size:clamp(22px,3vw,28px);color:var(--on-navy);line-height:1.15}
.takeaways{display:grid;gap:0;border-top:2px solid var(--navy)}
.ta{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:8px 28px;padding:18px 0;border-bottom:1px solid var(--rule)}
.ta h3{font-size:15px;line-height:1.3;color:var(--navy)}
:root[data-theme="dark"] .ta h3{color:var(--blue-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ta h3{color:var(--blue-ink)}}
.ta p{color:var(--muted);max-width:66ch}
@media (max-width:640px){.ta{grid-template-columns:1fr}.tb{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}

footer{background:var(--navy-deep);color:var(--on-navy-muted);font-size:13px}
footer .wrap{padding-block:36px;display:grid;gap:20px}
.foot-top{display:flex;gap:24px;justify-content:space-between;flex-wrap:wrap;align-items:flex-start}
.foot-top .who{display:grid;gap:2px}
.foot-top .who b{color:var(--on-navy);font-weight:600;font-size:15px}
.copy{appearance:none;background:none;border:1px solid rgba(249,249,249,.3);color:var(--on-navy);font:inherit;font-size:12px;padding:3px 9px;margin-left:8px;cursor:pointer;border-radius:2px}
.disclaimer{font-size:12px;line-height:1.55;max-width:90ch;border-top:1px solid rgba(249,249,249,.14);padding-top:16px}
@media (prefers-reduced-motion:no-preference){.tab,.jump a{transition:color .15s}}
</style>

</head>

  // ---------- chart helpers ----------
  function niceScale(min, max, ticks){
    var span = max - min, step = Math.pow(10, Math.floor(Math.log10(span / ticks)));
    [1,2,2.5,5,10].some(function(m){ if (span / (step*m) <= ticks){ step = step*m; return true; } });
    return {lo: Math.floor(min/step)*step, hi: Math.ceil(max/step)*step, step: step};
  }
  function lineChart(o){
    var W=560, H=240, L=52, R=16, T=18, B=34, iw=W-L-R, ih=H-T-B, n=o.labels.length;
    var all = o.series.reduce(function(a,s){ return a.concat(s.data); }, []);
    var sc = niceScale(o.min != null ? o.min : Math.min.apply(null, all), Math.max.apply(null, all), 4);
    var x = function(i){ return L + (n===1?0:i*iw/(n-1)); };
    var y = function(v){ return T + ih - (v-sc.lo)/(sc.hi-sc.lo)*ih; };
    var s = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria)+'">';
    var fi = o.forecastFrom ? o.labels.indexOf(o.forecastFrom) : -1;
    if (fi > 0){ var fx = (x(fi-1)+x(fi))/2; s += '<rect class="c-fc" x="'+fx+'" y="'+T+'" width="'+(L+iw-fx)+'" height="'+ih+'"/><text class="c-fc-t" x="'+(fx+6)+'" y="'+(T+12)+'">FORECAST</text>'; }
    for (var v=sc.lo; v<=sc.hi+1e-9; v+=sc.step){ s += '<line class="c-grid" x1="'+L+'" x2="'+(L+iw)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="c-axis" x="'+(L-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+esc(o.tick(v))+'</text>'; }
    var every = Math.ceil(n / (o.maxLabels || 8));
    o.labels.forEach(function(l,i){ if (i%every===0 || i===n-1) s += '<text class="c-axis" x="'+x(i)+'" y="'+(H-12)+'" text-anchor="middle">'+esc(l)+'</text>'; });
    o.series.forEach(function(se){
      var pts = se.data.map(function(v,i){ return [x(i), y(v)]; });
      var split = fi > 0 ? fi-1 : pts.length-1;
      var p1 = pts.slice(0, split+1), p2 = pts.slice(split);
      s += '<polyline class="'+se.cls+'" points="'+p1.map(function(p){return p.join(',');}).join(' ')+'"/>';
      if (fi > 0) s += '<polyline class="'+se.cls+' c-dash" points="'+p2.map(function(p){return p.join(',');}).join(' ')+'"/>';
      var hi = o.highlight != null ? o.highlight : split, hp = pts[hi];
      s += '<circle class="'+se.dot+'" cx="'+hp[0]+'" cy="'+hp[1]+'" r="4.5"/>';
      if (se.endLabel) s += '<text class="c-lbl" x="'+(hp[0] - 8)+'" y="'+(hp[1] - 10)+'" text-anchor="end">'+esc(se.endLabel)+'</text>';
    });
    return s + '</svg>';
  }
  function barChart(o){
    var W=760, H=260, L=48, R=12, T=18, B=34, iw=W-L-R, ih=H-T-B, n=o.labels.length;
    var max = Math.max.apply(null, o.a.concat(o.b)), sc = niceScale(0, max, 4);
    var gw = iw/n, bw = Math.min(16, gw*0.36);
    var y = function(v){ return T + ih - v/sc.hi*ih; };
    var fi = o.labels.indexOf(o.forecastFrom);
    var s = '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria)+'">';
    if (fi > 0){ var fx = L + fi*gw; s += '<rect class="c-fc" x="'+fx+'" y="'+T+'" width="'+(L+iw-fx)+'" height="'+ih+'"/><text class="c-fc-t" x="'+(fx+6)+'" y="'+(T+12)+'">FORECAST</text>'; }
    for (var v=0; v<=sc.hi+1e-9; v+=sc.step){ s += '<line class="c-grid" x1="'+L+'" x2="'+(L+iw)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text class="c-axis" x="'+(L-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+fmt(v)+'</text>'; }
    o.labels.forEach(function(l,i){
      var cx = L + i*gw + gw/2, f = fi > 0 && i >= fi ? ' c-faded' : '';
      s += '<rect class="c-b1'+f+'" x="'+(cx-bw-1)+'" y="'+y(o.a[i])+'" width="'+bw+'" height="'+(T+ih-y(o.a[i]))+'"><title>'+esc(l)+' delivered: '+fmt(o.a[i])+'</title></rect>';
      s += '<rect class="c-b2'+f+'" x="'+(cx+1)+'" y="'+y(o.b[i])+'" width="'+bw+'" height="'+(T+ih-y(o.b[i]))+'"><title>'+esc(l)+' absorbed: '+fmt(o.b[i])+'</title></rect>';
      if (i%2===0 || i===n-1) s += '<text class="c-axis" x="'+cx+'" y="'+(H-12)+'" text-anchor="middle">'+esc(l)+'</text>';
    });
    return s + '</svg>';
  }

  // ---------- sections ----------
  var S = [];
  var jump = [];
  function section(id, eyebrow, title, html){
    jump.push('<a href="#'+id+'">'+esc(eyebrow)+'</a>');
    S.push('<section id="'+id+'"><div class="sec-head"><span class="eyebrow">'+esc(eyebrow)+'</span><h2>'+esc(title)+'</h2></div>'+html+'</section>');
  }
  var tiles = function(arr){ return '<div class="tiles">'+arr.map(function(t){ return '<div class="tile"><span class="k">'+esc(t.k)+'</span><span class="v num">'+esc(t.v)+'</span><span class="d">'+t.d+'</span></div>'; }).join('')+'</div>'; };
  var src = function(t){ return '<p class="source">Source: '+esc(t)+'</p>'; };

  // Snapshot
  section('snapshot', 'Snapshot', D.submarket + ' at a glance',
    '<p class="lede">The headline numbers for the '+esc(D.submarket)+' apartment market as of '+esc(D.asOf)+'.</p>' + tiles(D.snapshot) + src(D.snapshotSource));

  // Rents & vacancy
  var maxVac = Math.max.apply(null, D.tiers.map(function(t){ return Math.max(t.vac, t.mvac); }));
  var tierBars = '<div class="tierbars">' + D.tiers.map(function(t){
    return '<div class="tb"><div class="name">'+esc(t.name)+(t.sub?'<br><span style="font-weight:400;color:var(--muted);font-size:12px">'+esc(t.sub)+'</span>':'')+'</div><div class="bars">'+
      '<div class="bar nl"><span class="n" style="width:'+(t.vac/maxVac*62)+'%"></span>'+t.vac.toFixed(1)+'%</div>'+
      '<div class="bar"><span class="m" style="width:'+(t.mvac/maxVac*62)+'%"></span>'+t.mvac.toFixed(1)+'% metro</div></div></div>';
  }).join('') + '</div>';
  var tierTable = '<div class="tbl-wrap"><table><thead><tr><th>Property tier</th><th class="r">Units</th><th class="r">Vacancy</th><th class="r">Avg asking rent</th><th class="r">Metro vacancy</th><th class="r">Metro rent</th></tr></thead><tbody>' +
    D.tiers.map(function(t){ return '<tr'+(t.total?' class="hl"':'')+'><td>'+esc(t.name)+(t.sub?' <span class="pill">'+esc(t.sub)+'</span>':'')+'</td><td class="r">'+fmt(t.units)+'</td><td class="r">'+t.vac.toFixed(1)+'%</td><td class="r">'+money(t.rent)+'</td><td class="r">'+t.mvac.toFixed(1)+'%</td><td class="r">'+money(t.mrent)+'</td></tr>'; }).join('') +
    '</tbody></table></div>';
  var h = D.history, fi = h.years.indexOf(h.forecastFrom);
  var rentChart = lineChart({labels:h.years, forecastFrom:h.forecastFrom, aria:'Average asking rent by year', series:[{data:h.rent, cls:'c-l1', dot:'c-dot1', endLabel: money(h.rent[fi-1])}], tick:function(v){return '$'+fmt(v);}, maxLabels:6});
  var vacChart = lineChart({labels:h.years, forecastFrom:h.forecastFrom, aria:'Vacancy rate by year', min:4, series:[{data:h.vacancy, cls:'c-l2', dot:'c-dot2', endLabel: h.vacancy[fi-1].toFixed(1)+'%'}], tick:function(v){return v.toFixed(0)+'%';}, maxLabels:6});
  section('rents', 'Rents & vacancy', 'Tighter than the metro in every tier',
    '<p class="lede">'+esc(D.rentText)+'</p>' +
    '<div class="charts2"><div class="panel"><h3>Average asking rent</h3>'+rentChart+'<p class="note">Monthly asking rent per unit; dashed line is the industry forecast.</p></div>' +
    '<div class="panel"><h3>Vacancy rate</h3>'+vacChart+'<p class="note">Share of units vacant; dashed line is the industry forecast.</p></div></div>' +
    '<div class="tier-row"><div class="panel"><h3>By property tier</h3>'+tierTable+'<p class="note">'+esc(D.metroContext)+'</p></div>' +
    '<div class="panel"><h3>Vacancy vs metro</h3><div class="legend"><span><i class="lg-blue"></i>'+esc(D.submarket)+'</span><span><i style="background:var(--rule)"></i>Metro</span></div>'+tierBars+'</div></div>' +
    src(D.rentSource));

  // Supply
  var sp = D.supply;
  var supChart = barChart({labels:sp.years, a:sp.delivered, b:sp.absorbed, forecastFrom:sp.forecastFrom, aria:'New units delivered and units absorbed by year'});
  var recentT = '<div class="tbl-wrap"><table><thead><tr><th>Property</th><th>Location</th><th class="r">Units</th><th class="r">Opened</th></tr></thead><tbody>' +
    D.recent.map(function(r){ return '<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td class="r">'+fmt(r[2])+'</td><td class="r">'+esc(r[3])+'</td></tr>'; }).join('') + '</tbody></table></div>';
  var plannedTotal = D.planned.reduce(function(a,r){ return a + r[2]; }, 0);
  var plannedT = '<div class="tbl-wrap"><table><thead><tr><th>Property</th><th>Location</th><th class="r">Units</th></tr></thead><tbody>' +
    D.planned.map(function(r){ return '<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td class="r">'+fmt(r[2])+'</td></tr>'; }).join('') +
    '<tr class="hl"><td>Total planned</td><td></td><td class="r">'+fmt(plannedTotal)+'</td></tr></tbody></table></div>';
  section('supply', 'New supply', 'The construction pipeline is nearly empty',
    '<p class="lede">'+esc(D.supplyText)+'</p>' +
    '<div class="panel"><h3>New units delivered vs units absorbed</h3><div class="legend"><span><i class="lg-navy"></i>Delivered</span><span><i class="lg-blue"></i>Absorbed (net move-ins)</span></div>'+supChart+'<p class="note">When absorption outpaces deliveries, the market tightens. 2026 to 2030 bars are forecasts.</p></div>' +
    '<div class="grid2"><div class="panel" style="align-content:start"><h3>Recently opened or leasing up</h3>'+recentT+'</div>' +
    '<div class="panel" style="align-content:start"><h3>Planned, not yet under construction <span class="pill gold">Watch list</span></h3>'+plannedT+'<p class="note">'+esc(D.plannedNote)+'</p></div></div>' +
    src(D.supplySource));

  // Pricing
  var pr = D.pricing;
  var priceChart = lineChart({labels:pr.years, aria:'Market price per unit by year', series:[
    {data:pr.all, cls:'c-l1', dot:'c-dot1', endLabel:'All Northland $'+Math.round(pr.all[pr.all.length-1]/100)/10+'K'},
    {data:pr.older, cls:'c-l2', dot:'c-dot2', endLabel:'Older properties $'+Math.round(pr.older[pr.older.length-1]/100)/10+'K'}], min:40000,
    tick:function(v){ return '$'+Math.round(v/1000)+'K'; }, maxLabels:6, highlight: pr.years.length-1});
  var subT = '<div class="tbl-wrap"><table><thead><tr><th>Submarket</th><th class="r">Market cap rate</th><th class="r">Price per unit</th></tr></thead><tbody>' +
    D.submarkets.map(function(r){ return '<tr'+(r[0]===D.submarket?' class="hl"':'')+'><td>'+esc(r[0])+'</td><td class="r">'+r[1].toFixed(1)+'%</td><td class="r">'+money(r[2])+'</td></tr>'; }).join('') + '</tbody></table></div>';
  section('pricing', 'Sales & pricing', 'What apartments are trading for',
    '<p class="lede">'+esc(D.pricingText)+'</p>' + tiles(D.pricingTiles) +
    '<div class="grid2"><div class="panel"><h3>Market price per unit</h3><div class="legend"><span><i class="lg-navy"></i>All Northland</span><span><i class="lg-gold"></i>Older properties</span></div>'+priceChart+'<p class="note">Modeled market price for the submarket, not an average of individual sales.</p></div>' +
    '<div class="panel" style="align-content:start"><h3>How '+esc(D.submarket)+' compares</h3>'+subT+'<p class="note">'+esc(D.metroSales)+'</p></div></div>' +
    '<div class="callout"><span class="eyebrow">Recent local sale: '+esc(D.localSale.title)+'</span><span class="big">'+esc(D.localSale.big)+'</span><p>'+esc(D.localSale.body)+'</p></div>' +
    src(D.pricingSource));

  // Jobs
  var card = function(c){ return '<div class="card"><span class="pill tag">'+esc(c.tag)+'</span><h3>'+esc(c.title)+'</h3>'+(c.fig?'<span class="fig num">'+esc(c.fig)+'</span>':'')+'<p>'+esc(c.body)+'</p></div>'; };
  section('jobs', 'Jobs & employers', 'Employers keep choosing the ' + D.submarket,
    '<div class="callout"><span class="big">'+esc(D.jobsCallout.big)+'</span><p>'+esc(D.jobsCallout.body)+'</p></div>' +
    '<div class="cards">'+D.employers.map(card).join('')+'</div>' + src(D.jobsSource));

  // Development
  section('development', 'Development', 'Bigger projects on the way',
    '<div class="cards">'+D.development.map(card).join('')+'</div>' + src(D.devSource));

  // Takeaways
  section('takeaways', 'Takeaways', 'What this means for ' + D.submarket + ' owners',
    '<div class="takeaways">'+D.takeaways.map(function(t){ return '<div class="ta"><h3>'+esc(t[0])+'</h3><p>'+esc(t[1])+'</p></div>'; }).join('')+'</div>');

  $('sections').innerHTML = S.join('');
  $('jump').innerHTML = jump.join('');

  // Footer
  var c = D.contact;
  $('who').innerHTML = '<b>'+esc(c.name)+'</b><span>'+esc(c.role)+', '+esc(c.company)+'</span><span>'+esc(c.address)+'</span>' +
    '<span><a href="mailto:'+esc(c.email)+'" style="color:var(--on-navy)">'+esc(c.email)+'</a><button class="copy" id="copy-email" type="button">Copy</button></span>';
  $('disclaimer').textContent = D.disclaimer + ' Data as of ' + D.asOf + '.';
  $('copy-email').addEventListener('click', function(){
    var b = this, done = function(){ b.textContent = 'Copied'; setTimeout(function(){ b.textContent = 'Copy'; }, 1600); };
    try { navigator.clipboard.writeText(c.email).then(done, function(){ selectText(); }); } catch(e){ selectText(); }
    function selectText(){ var a = b.previousElementSibling, r = document.createRange(); r.selectNodeContents(a); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  });
})();
</script>

</body>
</html>
